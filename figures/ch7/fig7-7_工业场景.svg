<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">四个工业场景：沉睡的资料变成能回答问题的资产</text>

  <rect x="70" y="100" width="420" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="100" width="420" height="52" rx="14" fill="#E8F3FF"/>
  <text x="280" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">① 企业标准问答</text>
  <text x="280" y="180" text-anchor="middle" font-size="14" fill="#1F2329">“这个公差按企标该怎么执行？”</text>
  <text x="280" y="210" text-anchor="middle" font-size="13" fill="#646A73">→ 答案带条款出处（按条款切分）</text>

  <rect x="510" y="100" width="420" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="510" y="100" width="420" height="52" rx="14" fill="#E8F3FF"/>
  <text x="720" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">② 设备手册问答</text>
  <text x="720" y="180" text-anchor="middle" font-size="14" fill="#1F2329">“主轴轴承多久换一次油？”</text>
  <text x="720" y="210" text-anchor="middle" font-size="13" fill="#646A73">→ 查表类问题，答案带章节出处（见效最快）</text>

  <rect x="70" y="300" width="420" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="300" width="420" height="52" rx="14" fill="#FFF4E5"/>
  <text x="280" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#D9480F">③ 图纸说明与工艺文件</text>
  <text x="280" y="380" text-anchor="middle" font-size="14" fill="#1F2329">“这个材料牌号是什么意思？”</text>
  <text x="280" y="410" text-anchor="middle" font-size="13" fill="#646A73">→ 图纸文字先 OCR / CAD 导出，再入库</text>

  <rect x="510" y="300" width="420" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="510" y="300" width="420" height="52" rx="14" fill="#FFF4E5"/>
  <text x="720" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#D9480F">④ 老师傅经验与故障记录</text>
  <text x="720" y="380" text-anchor="middle" font-size="14" fill="#1F2329">口述经验、历史故障记录</text>
  <text x="720" y="410" text-anchor="middle" font-size="13" fill="#646A73">→ 最值钱也最难入库：先清洗、统一术语</text>

  <rect x="130" y="520" width="740" height="56" rx="12" fill="#EAFBF0" stroke="#34C07C" stroke-width="1.5"/>
  <text x="500" y="548" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E7A46">规律：资料越结构化，RAG 效果越好</text>
  <text x="500" y="568" text-anchor="middle" font-size="13" fill="#646A73">标准 &gt; 手册 &gt; 图纸说明 &gt; 口述记录——从手册起步，跑通了再扩展</text>

  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 7-7 企业标准、设备手册、图纸说明都能问（示意）</text>
</svg>
