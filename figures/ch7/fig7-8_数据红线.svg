<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">数据安全红线：什么能进知识库</text>

  <rect x="70" y="110" width="420" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="110" width="420" height="52" rx="14" fill="#EAFBF0"/>
  <text x="280" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E7A46">能进：公开 / 内部</text>
  <text x="280" y="192" text-anchor="middle" font-size="14" fill="#1F2329">公开标准、行业知识、产品说明书</text>
  <text x="280" y="222" text-anchor="middle" font-size="14" fill="#1F2329">企业标准、内部手册、工艺文件</text>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#646A73">内部资料也要控制访问权限，留检索日志</text>

  <line x1="490" y1="200" x2="530" y2="200" stroke="#D9480F" stroke-width="3"/>
  <text x="510" y="192" text-anchor="middle" font-size="18" font-weight="bold" fill="#D9480F">红线</text>

  <rect x="540" y="110" width="390" height="180" rx="14" fill="#FFFFFF" stroke="#FF7D00" stroke-width="2"/>
  <rect x="540" y="110" width="390" height="52" rx="14" fill="#FFF4E5"/>
  <text x="735" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#D9480F">默认不进：保密 / 涉密</text>
  <text x="735" y="192" text-anchor="middle" font-size="14" fill="#1F2329">客户图纸、工艺诀窍、报价</text>
  <text x="735" y="222" text-anchor="middle" font-size="14" fill="#1F2329">客户名单、涉密项目资料</text>
  <text x="735" y="262" text-anchor="middle" font-size="13" fill="#646A73">特别是客户图纸：很多有保密协议，上传即违约</text>

  <rect x="70" y="330" width="860" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="110" y="368" font-size="15" font-weight="bold" fill="#1F2329">三条技术边界：</text>
  <text x="110" y="402" font-size="14" fill="#1F2329">· 部署位置：知识库和 embedding 模型放企业内部，还是云端？</text>
  <text x="110" y="430" font-size="14" fill="#1F2329">· 权限控制：谁能问、谁能看答案——按角色限制可见范围</text>
  <text x="110" y="458" font-size="14" fill="#1F2329">· 外发即失控：资料一旦发出去就收不回来，上传前先过红线清单</text>

  <rect x="130" y="500" width="740" height="56" rx="12" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="500" y="528" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">判断标准：把这条资料交出去，出了事谁负责？</text>
  <text x="500" y="548" text-anchor="middle" font-size="13" fill="#646A73">拿不准，就不进；真要进，先进私有化环境（第 9 章）</text>

  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 7-8 公开/内部能进，保密/涉密不进（示意）</text>
</svg>
