<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">RAG 五步：先查资料，再作答</text>
  <defs>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker>
  </defs>

  <rect x="70" y="105" width="172" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="105" width="172" height="52" rx="14" fill="#E8F3FF"/>
  <text x="156" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2B6CB0">① 切分</text>
  <text x="156" y="180" text-anchor="middle" font-size="14" fill="#1F2329">200 页手册</text>
  <text x="156" y="204" text-anchor="middle" font-size="14" fill="#1F2329">切成小段</text>
  <text x="156" y="240" text-anchor="middle" font-size="13" fill="#646A73">按章节 / 段落</text>

  <line x1="242" y1="195" x2="278" y2="195" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrb)"/>

  <rect x="284" y="105" width="172" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="284" y="105" width="172" height="52" rx="14" fill="#E8F3FF"/>
  <text x="370" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2B6CB0">② 向量化</text>
  <text x="370" y="180" text-anchor="middle" font-size="14" fill="#1F2329">每段文本</text>
  <text x="370" y="204" text-anchor="middle" font-size="14" fill="#1F2329">变向量，入库</text>
  <text x="370" y="240" text-anchor="middle" font-size="13" fill="#646A73">离线建库，只查不建</text>

  <line x1="456" y1="195" x2="492" y2="195" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrb)"/>

  <rect x="498" y="105" width="172" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="498" y="105" width="172" height="52" rx="14" fill="#FFF4E5"/>
  <text x="584" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#D9480F">③ 检索</text>
  <text x="584" y="180" text-anchor="middle" font-size="14" fill="#1F2329">问题变向量</text>
  <text x="584" y="204" text-anchor="middle" font-size="14" fill="#1F2329">找最相近 K 段</text>
  <text x="584" y="240" text-anchor="middle" font-size="13" fill="#646A73">Top-3 ~ 5 召回</text>

  <line x1="670" y1="195" x2="706" y2="195" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrb)"/>

  <rect x="712" y="105" width="172" height="180" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="712" y="105" width="172" height="52" rx="14" fill="#FFF4E5"/>
  <text x="798" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#D9480F">④ 重排</text>
  <text x="798" y="180" text-anchor="middle" font-size="14" fill="#1F2329">二次精细打分</text>
  <text x="798" y="204" text-anchor="middle" font-size="14" fill="#1F2329">最相关顶到前</text>
  <text x="798" y="240" text-anchor="middle" font-size="13" fill="#646A73">粗召回多取，精排少留</text>

  <rect x="70" y="330" width="814" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="330" width="814" height="52" rx="14" fill="#EAFBF0"/>
  <text x="477" y="361" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E7A46">⑤ 生成：问题 + 检索到的资料原文 → 大模型</text>
  <text x="477" y="404" text-anchor="middle" font-size="15" fill="#1F2329">“请只根据下面资料回答，资料里没有的信息就说没有，并注明出处”</text>
  <text x="477" y="432" text-anchor="middle" font-size="13" fill="#646A73">答案不是模型“想”出来的，是“照着资料说”的——可溯源</text>

  <rect x="940" y="105" width="0" height="0" fill="none"/>
  <text x="500" y="500" text-anchor="middle" font-size="14" fill="#646A73">效果：答设备手册问题 → 输出“答案 + 出处（第几段资料）”</text>

  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 7-3 先查资料再作答，答案带出处（示意）</text>
</svg>
