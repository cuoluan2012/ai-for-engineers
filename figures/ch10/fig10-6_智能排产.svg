<text x="1000.0" y="155.9" font-size="54" fill="#FFFFFF" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">智能排产：在约束里找好解</text>
<text x="1000.0" y="215.5" font-size="30" fill="#5A6B7B" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">排产不是“AI 凭空给答案”，而是硬约束里尽量满足软目标</text>
<rect x="120" y="320" width="380" height="330" rx="26" fill="#D6E6F5" stroke="#2E5E8C" stroke-width="3"/>
<text x="310" y="404.0" font-size="40" fill="#2E5E8C" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">订单</text>
<text x="310" y="455.5" font-size="30" fill="#2B3A4A" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">12 个订单</text>
<text x="310" y="495.5" font-size="30" fill="#2B3A4A" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">总工时 70h</text>
<text x="310" y="535.5" font-size="30" fill="#2B3A4A" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">交期卡临界</text>
