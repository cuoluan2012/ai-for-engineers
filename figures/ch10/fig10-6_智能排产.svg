<text x="715.0" y="575.2" font-size="26" fill="#FFFFFF" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">换型</text>
<text x="800" y="575.1" font-size="26" fill="#2B3A4A" text-anchor="start" font-family="PingFang SC,STHeiti,sans-serif">每次 0.5h</text>
<rect x="660" y="589" width="110" height="44.199999999999996" rx="16" fill="#2E5E8C"/>
<text x="715.0" y="633.2" font-size="26" fill="#FFFFFF" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">物料</text>
<text x="800" y="633.1" font-size="26" fill="#2B3A4A" text-anchor="start" font-family="PingFang SC,STHeiti,sans-serif">齐套才能排</text>
<text x="870" y="628.1" font-size="26" fill="#D96C5F" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">硬约束：不能违反</text>
<rect x="1230" y="320" width="320" height="330" rx="26" fill="#FDEBD3" stroke="#F2A03D" stroke-width="3"/>
<text x="1390" y="412.3" font-size="38" fill="#F2A03D" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">排程器</text>
<text x="1390" y="475.5" font-size="30" fill="#2B3A4A" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">优先级 → 交期</text>
<text x="1390" y="515.5" font-size="30" fill="#2B3A4A" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">启发式排程</text>
<text x="1390" y="555.5" font-size="30" fill="#2B3A4A" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">（或运筹求解器）</text>
<text x="1390" y="612.1" font-size="26" fill="#5E9E6B" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">软目标：尽量做好</text>
