<polygon points="1530,760 1504.6,754.4 1518.6,736.6" fill="#9DB4C6"/>
<rect x="300" y="1000" width="1400" height="110" rx="22" fill="#F9E3DF" stroke="#D96C5F" stroke-width="3"/>
<text x="1000.0" y="1083.9" font-size="34" fill="#D96C5F" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">坑：约束没说全（漏换型时间）→ 排程再漂亮也执行不了</text>
<text x="1000.0" y="1330.1" font-size="26" fill="#8A99A8" text-anchor="middle" font-family="PingFang SC,STHeiti,sans-serif">图 10-6 · 智能排产：订单 → 约束 → 排程 → 车间</text>
