<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">缺陷分类项目：一张图进去，一个类别出来</text>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10 Z" fill="#2B6CB0"/></marker></defs>
  <rect x="55" y="130" width="200" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="155" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">① 输入：缺陷图</text>
  <rect x="80" y="180" width="52" height="52" rx="4" fill="#E8E8E8" stroke="#C0C4CC" stroke-width="1"/>
  <text x="106" y="212" text-anchor="middle" font-size="11" fill="#888">正常</text>
  <rect x="150" y="180" width="52" height="52" rx="4" fill="#E8E8E8" stroke="#C0C4CC" stroke-width="1"/>
  <line x1="176" y1="182" x2="176" y2="230" stroke="#666" stroke-width="5"/>
  <text x="176" y="249" text-anchor="middle" font-size="11" fill="#888">划痕</text>
  <rect x="95" y="255" width="52" height="52" rx="4" fill="#E8E8E8" stroke="#C0C4CC" stroke-width="1"/>
  <circle cx="121" cy="281" r="10" fill="#666"/>
  <text x="121" y="324" text-anchor="middle" font-size="11" fill="#888">气泡</text>
  <text x="155" y="340" text-anchor="middle" font-size="12" fill="#646A73">16×16 灰度图</text>
  <rect x="290" y="130" width="200" height="230" rx="14" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="390" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">② CNN 模型</text>
  <rect x="315" y="185" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="390" y="209" text-anchor="middle" font-size="13" fill="#2B6CB0">卷积 + 池化 ×2</text>
  <rect x="315" y="235" width="150" height="38" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="390" y="259" text-anchor="middle" font-size="13" fill="#2B6CB0">全连接 → 3 类</text>
  <text x="390" y="300" text-anchor="middle" font-size="12" fill="#646A73">逐级提取缺陷特征</text>
  <text x="390" y="322" text-anchor="middle" font-size="12" fill="#646A73">60 轮 × CPU 几秒</text>
  <rect x="525" y="130" width="200" height="230" rx="14" fill="#EBFAF0" stroke="#34C07C" stroke-width="2"/>
  <text x="625" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F855A">③ 输出：类别</text>
  <rect x="555" y="190" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#34C07C" stroke-width="1.5"/>
  <text x="625" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F855A">正常</text>
  <rect x="555" y="244" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#34C07C" stroke-width="1.5"/>
  <text x="625" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F855A">划痕</text>
  <rect x="555" y="298" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#34C07C" stroke-width="1.5"/>
  <text x="625" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F855A">气泡</text>
  <rect x="760" y="130" width="190" height="230" rx="14" fill="#FFF4E5" stroke="#FF7D00" stroke-width="2"/>
  <text x="855" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">④ 评估把关</text>
  <text x="855" y="205" text-anchor="middle" font-size="13" fill="#1F2329">测试集准确率</text>
  <text x="855" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">95.00%</text>
  <rect x="790" y="248" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="855" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#D9480F">混淆矩阵</text>
  <text x="855" y="296" text-anchor="middle" font-size="12" fill="#646A73">18 1 0</text>
  <text x="855" y="314" text-anchor="middle" font-size="12" fill="#646A73">0 15 2</text>
  <text x="855" y="332" text-anchor="middle" font-size="12" fill="#646A73">0 0 24</text>
  <line x1="255" y1="245" x2="290" y2="245" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="490" y1="245" x2="525" y2="245" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="725" y1="245" x2="760" y2="245" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="120" y="420" width="760" height="90" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="500" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">合成数据是为了练"深度学习功夫"</text>
  <text x="500" y="483" text-anchor="middle" font-size="13" fill="#646A73">换成真实缺陷图片目录，骨架不用改——换数据、换类别名即可复用</text>
  <rect x="180" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 5-7 缺陷分类流水线：图进 → CNN 提特征 → 类别出 → 指标把关（示意）</text>
</svg>
