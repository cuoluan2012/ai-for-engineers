<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">序列模型：逐段读、记住前文</text>
  <rect x="90" y="130" width="820" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="120" y="162" font-size="15" font-weight="bold" fill="#2B6CB0">振动信号：一串按时间排列的点</text>
  <polyline points="150,220 220,215 290,205 360,190 430,195 500,175 570,165 640,155 710,160 780,140" fill="none" stroke="#2B6CB0" stroke-width="3"/>
  <circle cx="360" cy="190" r="7" fill="#FF7D00"/>
  <text x="360" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#D9480F">当前点</text>
  <circle cx="220" cy="215" r="5" fill="#94A3B8"/>
  <circle cx="290" cy="205" r="5" fill="#94A3B8"/>
  <circle cx="430" cy="195" r="5" fill="#94A3B8"/>
  <circle cx="500" cy="175" r="5" fill="#94A3B8"/>
  <circle cx="570" cy="165" r="5" fill="#94A3B8"/>
  <text x="120" y="118" font-size="13" fill="#646A73">同一个幅值，前面是平稳还是爬升，含义完全不同</text>
  <rect x="90" y="330" width="400" height="170" rx="14" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="290" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">RNN：逐段读，带摘要往下传</text>
  <rect x="120" y="388" width="60" height="50" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="150" y="420" text-anchor="middle" font-size="13" fill="#1F2329">段1</text>
  <rect x="210" y="388" width="60" height="50" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="240" y="420" text-anchor="middle" font-size="13" fill="#1F2329">段2</text>
  <rect x="300" y="388" width="60" height="50" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="330" y="420" text-anchor="middle" font-size="13" fill="#1F2329">段3</text>
  <rect x="390" y="388" width="60" height="50" rx="8" fill="#FFF4E5" stroke="#FF7D00" stroke-width="2"/>
  <text x="420" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#D9480F">段4</text>
  <line x1="180" y1="413" x2="210" y2="413" stroke="#94A3B8" stroke-width="2"/>
  <line x1="270" y1="413" x2="300" y2="413" stroke="#94A3B8" stroke-width="2"/>
  <line x1="360" y1="413" x2="390" y2="413" stroke="#94A3B8" stroke-width="2"/>
  <text x="290" y="468" text-anchor="middle" font-size="13" fill="#646A73">隐藏状态 = 压缩记忆，逐段更新传递</text>
  <text x="290" y="488" text-anchor="middle" font-size="13" fill="#646A73">读段4 时带着段1~3 的摘要</text>
  <rect x="530" y="330" width="380" height="170" rx="14" fill="#FFF4E5" stroke="#FF7D00" stroke-width="2"/>
  <text x="720" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#D9480F">LSTM：三扇门管记忆</text>
  <rect x="560" y="390" width="90" height="52" rx="8" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="605" y="412" text-anchor="middle" font-size="13" fill="#1F2329">记不记</text>
  <text x="605" y="432" text-anchor="middle" font-size="11" fill="#94A3B8">输入门</text>
  <rect x="670" y="390" width="90" height="52" rx="8" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="715" y="412" text-anchor="middle" font-size="13" fill="#1F2329">忘不忘</text>
  <text x="715" y="432" text-anchor="middle" font-size="11" fill="#94A3B8">遗忘门</text>
  <rect x="780" y="390" width="90" height="52" rx="8" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="825" y="412" text-anchor="middle" font-size="13" fill="#1F2329">出不出</text>
  <text x="825" y="432" text-anchor="middle" font-size="11" fill="#94A3B8">输出门</text>
  <text x="720" y="475" text-anchor="middle" font-size="13" fill="#646A73">能记住更长的历史，趋势预警更稳</text>
  <rect x="180" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 5-4 RNN 逐段读并记住前文，LSTM 用三扇门管记忆、记得更久（示意）</text>
</svg>
