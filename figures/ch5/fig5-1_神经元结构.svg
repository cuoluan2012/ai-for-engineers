<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">神经元：加权求和 + 激活函数</text>
  <rect x="70" y="120" width="180" height="110" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="160" y="155" text-anchor="middle" font-size="14" fill="#646A73">输入 x1</text>
  <text x="160" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">直径 20mm</text>
  <text x="160" y="212" text-anchor="middle" font-size="12" fill="#646A73">× 权重 w1</text>
  <rect x="70" y="270" width="180" height="110" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="160" y="305" text-anchor="middle" font-size="14" fill="#646A73">输入 x2</text>
  <text x="160" y="335" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">转速 1500rpm</text>
  <text x="160" y="362" text-anchor="middle" font-size="12" fill="#646A73">× 权重 w2</text>
  <rect x="70" y="420" width="180" height="110" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="160" y="455" text-anchor="middle" font-size="14" fill="#646A73">输入 x3</text>
  <text x="160" y="485" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">负载 0.8</text>
  <text x="160" y="512" text-anchor="middle" font-size="12" fill="#646A73">× 权重 w3</text>
  <rect x="330" y="230" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="450" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2329">求和 + 偏置 b</text>
  <text x="450" y="308" text-anchor="middle" font-size="15" fill="#646A73">综合成一个分数</text>
  <text x="450" y="338" text-anchor="middle" font-size="13" fill="#94A3B8">像称重分拣先称总重</text>
  <text x="450" y="368" text-anchor="middle" font-size="13" fill="#94A3B8">再决定进哪个筐</text>
  <rect x="640" y="230" width="240" height="170" rx="14" fill="#FFF4E5" stroke="#FF7D00" stroke-width="2"/>
  <text x="760" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#D9480F">激活函数</text>
  <text x="760" y="308" text-anchor="middle" font-size="15" fill="#1F2329">ReLU：负数归零</text>
  <text x="760" y="338" text-anchor="middle" font-size="13" fill="#646A73">过线就输出 1</text>
  <text x="760" y="368" text-anchor="middle" font-size="13" fill="#646A73">不过线输出 0</text>
  <rect x="320" y="115" width="45" height="40" rx="8" fill="#2B6CB0" opacity="0.12"/>
  <text x="342" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">×w1</text>
  <rect x="320" y="265" width="45" height="40" rx="8" fill="#2B6CB0" opacity="0.12"/>
  <text x="342" y="291" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">×w2</text>
  <rect x="320" y="415" width="45" height="40" rx="8" fill="#2B6CB0" opacity="0.12"/>
  <text x="342" y="441" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">×w3</text>
  <line x1="250" y1="175" x2="320" y2="135" stroke="#94A3B8" stroke-width="2"/>
  <line x1="250" y1="325" x2="320" y2="285" stroke="#94A3B8" stroke-width="2"/>
  <line x1="250" y1="475" x2="320" y2="435" stroke="#94A3B8" stroke-width="2"/>
  <line x1="570" y1="315" x2="640" y2="315" stroke="#FF7D00" stroke-width="3"/>
  <text x="605" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#D9480F">判断</text>
  <rect x="880" y="300" width="70" height="40" rx="10" fill="#34C07C" opacity="0.15"/>
  <text x="915" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#2F855A">输出</text>
  <line x1="880" y1="315" x2="880" y2="320" stroke="#94A3B8" stroke-width="2"/>
  <rect x="180" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 5-1 神经元：输入加权求和、过激活函数，像称重分拣的小工位（示意）</text>
</svg>
