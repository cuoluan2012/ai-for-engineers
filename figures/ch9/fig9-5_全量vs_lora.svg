<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="640" fill="#F7F8FA"/>
  <text x="500" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">全量微调 vs LoRA：同一任务，两条路线</text>

  <!-- 左：全量微调 -->
  <rect x="60" y="100" width="420" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="60" y="100" width="420" height="56" rx="14" fill="#E8F3FF"/>
  <text x="270" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B6CB0">全量微调：动全身</text>
  <text x="92" y="196" font-size="14" fill="#1F2329">· 更新参数：1185（全部）</text>
  <text x="92" y="222" font-size="14" fill="#1F2329">· 厂规误差：0.0182 Ra</text>
  <text x="92" y="248" font-size="14" fill="#1F2329">· 每个参数都要算梯度、存梯度</text>
  <text x="92" y="274" font-size="14" fill="#1F2329">· 显存和算力需求大</text>
  <rect x="92" y="310" width="356" height="60" rx="10" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="270" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#D9480F">副作用：灾难性遗忘</text>
  <text x="270" y="356" text-anchor="middle" font-size="14" fill="#D9480F">学厂规，通用能力被“带偏”</text>
  <text x="92" y="396" font-size="14" fill="#646A73">09-1 实测：通用误差 0.1360 → 1.2461</text>

  <!-- 右：LoRA -->
  <rect x="520" y="100" width="420" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="520" y="100" width="420" height="56" rx="14" fill="#EAFBF0"/>
  <text x="730" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E7A46">LoRA：只动两个小矩阵</text>
  <text x="552" y="196" font-size="14" fill="#1F2329">· 更新参数：524（44.2%）</text>
  <text x="552" y="222" font-size="14" fill="#1F2329">· 厂规误差：0.0179 Ra</text>
  <text x="552" y="248" font-size="14" fill="#1F2329">· 原权重 W 全程冻结</text>
  <text x="552" y="274" font-size="14" fill="#1F2329">· 只训练旁路 B×A（W' = W + BA）</text>
  <rect x="552" y="310" width="356" height="60" rx="10" fill="#EAFBF0" stroke="#34C07C" stroke-width="1.5"/>
  <text x="730" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E7A46">通用知识一点没动</text>
  <text x="730" y="356" text-anchor="middle" font-size="14" fill="#1E7A46">效果反而略好于全量微调</text>
  <text x="552" y="396" font-size="14" fill="#646A73">合并验证：W + B×A 与 LoRA 前向差 0.000000</text>

  <!-- 底部 -->
  <rect x="120" y="470" width="760" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500" y="502" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">小模型上省一半；真实大模型（70 亿参数）上是数量级的差距</text>
  <text x="500" y="528" text-anchor="middle" font-size="14" fill="#646A73">全量要更新 70 亿个参数，LoRA 通常只更新几百万个——占比不到 1%</text>

  <rect x="180" y="560" width="640" height="38" rx="10" fill="#EAFBF0" stroke="#34C07C" stroke-width="1.5"/>
  <text x="500" y="584" text-anchor="middle" font-size="14" fill="#1E7A46">不是“省了钱效果打折”，是又省又好——工业场景微调的主流做法</text>

  <rect x="180.0" y="604" width="640" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="625" text-anchor="middle" font-size="14" fill="#646A73">图 9-5 全量微调 vs LoRA：更新参数对比（示意）</text>
</svg>
