<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="620" fill="#F7F8FA"/>
  <text x="500" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">LoRA 原理：不更新全部权重，只学一个低秩增量</text>
  <text x="500" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">W' = W + B × A</text>

  <!-- 输入 -->
  <rect x="60" y="200" width="150" height="90" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="135" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">输入 x</text>
  <text x="135" y="264" text-anchor="middle" font-size="14" fill="#646A73">（如：硬度、轴径）</text>

  <!-- 主路径 W -->
  <line x1="210" y1="245" x2="360" y2="245" stroke="#2B6CB0" stroke-width="3"/>
  <rect x="360" y="200" width="200" height="90" rx="12" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="460" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B6CB0">原权重 W</text>
  <text x="460" y="264" text-anchor="middle" font-size="14" fill="#1E7A46">冻结不动（训练时）</text>
  <line x1="560" y1="245" x2="700" y2="245" stroke="#2B6CB0" stroke-width="3"/>

  <!-- 旁路 B×A -->
  <line x1="210" y1="290" x2="300" y2="380" stroke="#FF7D00" stroke-width="2.5" stroke-dasharray="6,5"/>
  <text x="240" y="345" font-size="14" fill="#D9480F">旁路</text>
  <rect x="300" y="340" width="190" height="80" rx="12" fill="#FFF4E5" stroke="#FF7D00" stroke-width="2"/>
  <text x="395" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">小矩阵 A、B</text>
  <text x="395" y="394" text-anchor="middle" font-size="14" fill="#D9480F">只更新这两个（少量参数）</text>
  <line x1="490" y1="380" x2="640" y2="300" stroke="#FF7D00" stroke-width="2.5" stroke-dasharray="6,5"/>

  <!-- 相加 -->
  <rect x="700" y="220" width="90" height="60" rx="12" fill="#EAFBF0" stroke="#34C07C" stroke-width="2"/>
  <text x="745" y="247" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E7A46">相加</text>
  <text x="745" y="269" text-anchor="middle" font-size="14" fill="#1E7A46">Wx + B(Ax)</text>

  <!-- 输出 -->
  <line x1="790" y1="250" x2="880" y2="250" stroke="#34C07C" stroke-width="3"/>
  <rect x="880" y="200" width="90" height="100" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="925" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">输出</text>
  <text x="925" y="264" text-anchor="middle" font-size="14" fill="#646A73">厂里口径</text>
  <text x="925" y="286" text-anchor="middle" font-size="14" fill="#646A73">的回答</text>

  <!-- 低秩说明 -->
  <rect x="60" y="120" width="420" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="270" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">为什么低秩够用：领域适配的“修改量”</text>
  <text x="270" y="165" text-anchor="middle" font-size="14" fill="#646A73">集中在少数方向，一个低秩矩阵就能表达</text>

  <!-- 部署说明 -->
  <rect x="520" y="120" width="420" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="730" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">部署时合并：W' = W + B×A 算一次</text>
  <text x="730" y="165" text-anchor="middle" font-size="14" fill="#646A73">推理速度与未微调模型完全一样</text>

  <!-- 底部 -->
  <rect x="180" y="470" width="640" height="52" rx="12" fill="#EAFBF0" stroke="#34C07C" stroke-width="1.5"/>
  <text x="500" y="495" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E7A46">训练只更新 A、B：参数少、显存省、通用知识一点不动</text>
  <text x="500" y="516" text-anchor="middle" font-size="14" fill="#1E7A46">工程类比：给标准机床加一套专用工装，不改机床本体</text>

  <rect x="180.0" y="568" width="640" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="589" text-anchor="middle" font-size="14" fill="#646A73">图 9-4 LoRA 原理：W' = W + BA 低秩分解（示意）</text>
</svg>
