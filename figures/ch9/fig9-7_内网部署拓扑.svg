<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">私有化部署拓扑：把 AI 装进企业防火墙</text>

  <!-- 企业内网大框 -->
  <rect x="60" y="100" width="680" height="440" rx="18" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="3"/>
  <text x="90" y="132" font-size="16" font-weight="bold" fill="#2B6CB0">企业内网（防火墙内）</text>
  <text x="90" y="154" font-size="14" fill="#1E7A46">模型与数据全程不出内网</text>

  <!-- 内网客户端 -->
  <rect x="100" y="180" width="170" height="120" rx="12" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="185" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">客户端</text>
  <text x="185" y="240" text-anchor="middle" font-size="14" fill="#1F2329">厂里软件 / 网页</text>
  <text x="185" y="262" text-anchor="middle" font-size="14" fill="#1F2329">智能体</text>
  <text x="185" y="284" text-anchor="middle" font-size="14" fill="#646A73">访问内网地址</text>

  <!-- 模型服务 -->
  <rect x="390" y="180" width="170" height="120" rx="12" fill="#FFF4E5" stroke="#FF7D00" stroke-width="2"/>
  <text x="475" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">模型服务</text>
  <text x="475" y="240" text-anchor="middle" font-size="14" fill="#1F2329">Ollama / vLLM</text>
  <text x="475" y="262" text-anchor="middle" font-size="14" fill="#1F2329">微调后的模型</text>
  <text x="475" y="284" text-anchor="middle" font-size="14" fill="#646A73">常驻进程</text>

  <!-- GPU -->
  <rect x="640" y="180" width="90" height="120" rx="12" fill="#EAFBF0" stroke="#34C07C" stroke-width="2"/>
  <text x="685" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E7A46">GPU</text>
  <text x="685" y="246" text-anchor="middle" font-size="14" fill="#1F2329">服务器</text>
  <text x="685" y="268" text-anchor="middle" font-size="14" fill="#1F2329">装模型</text>
  <text x="685" y="288" text-anchor="middle" font-size="14" fill="#1F2329">跑推理</text>

  <!-- 内网连线 -->
  <line x1="270" y1="240" x2="390" y2="240" stroke="#2B6CB0" stroke-width="2.5"/>
  <polygon points="390,240 376,232 376,248" fill="#2B6CB0"/>
  <line x1="560" y1="240" x2="640" y2="240" stroke="#2B6CB0" stroke-width="2.5"/>
  <polygon points="640,240 626,232 626,248" fill="#2B6CB0"/>

  <!-- 知识库 / 日志 -->
  <rect x="100" y="340" width="240" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="220" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">企业知识库 / 语料库</text>
  <text x="220" y="390" text-anchor="middle" font-size="14" fill="#646A73">RAG 检索 + 微调数据（9.7 脱敏）</text>

  <rect x="380" y="340" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="505" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">日志与审计</text>
  <text x="505" y="390" text-anchor="middle" font-size="14" fill="#646A73">谁问了什么、答了什么（9.7.3）</text>

  <!-- 防火墙边界 -->
  <rect x="740" y="100" width="60" height="440" rx="10" fill="#FFF4E5" stroke="#D9480F" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="770" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">防火墙</text>

  <!-- 外部访问 -->
  <rect x="850" y="180" width="120" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="910" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">外网用户</text>
  <text x="910" y="234" text-anchor="middle" font-size="14" fill="#646A73">（如外地分厂）</text>
  <rect x="850" y="300" width="120" height="60" rx="12" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="910" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#D9480F">VPN / 网关</text>
  <text x="910" y="346" text-anchor="middle" font-size="14" fill="#646A73">受控访问</text>

  <!-- 底部检查清单 -->
  <rect x="100" y="480" width="620" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="410" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">上线检查清单：备份 · 日志 · 监控 · 回滚</text>
  <text x="410" y="522" text-anchor="middle" font-size="14" fill="#646A73">升级坏了能退回旧版，产线不停摆（9.6.4）</text>

  <rect x="180.0" y="620" width="640" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="643" text-anchor="middle" font-size="14" fill="#646A73">图 9-7 私有化部署拓扑：数据不出企业内网（示意）</text>
</svg>
