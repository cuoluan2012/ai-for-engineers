<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">技术选型决策链：提示词 → RAG → 微调</text>
  <text x="500" y="78" text-anchor="middle" font-size="15" fill="#646A73">同样“让 AI 懂厂规”，三种方式从轻到重——先试最轻的</text>

  <!-- 卡片 1：提示词 -->
  <rect x="55" y="110" width="280" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="55" y="110" width="280" height="52" rx="14" fill="#E8F3FF"/>
  <text x="195" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B6CB0">提示词（现场教）</text>
  <text x="195" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">改的是输入</text>
  <text x="82" y="204" font-size="14" fill="#1F2329">能解决：</text>
  <text x="82" y="226" font-size="14" fill="#1F2329">· 一次性、量小的规则</text>
  <text x="82" y="248" font-size="14" fill="#1F2329">· 临时口径、试用场景</text>
  <text x="82" y="286" font-size="14" fill="#1F2329">不能解决：</text>
  <text x="82" y="308" font-size="14" fill="#1F2329">· 规则多、要稳定复用</text>
  <text x="82" y="330" font-size="14" fill="#1F2329">· 知识会变需要维护</text>
  <rect x="82" y="358" width="226" height="46" rx="10" fill="#EAFBF0"/>
  <text x="195" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E7A46">成本：几乎为零</text>
  <text x="195" y="401" text-anchor="middle" font-size="14" fill="#1E7A46">先从这里试</text>

  <!-- 卡片 2：RAG -->
  <rect x="360" y="110" width="280" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="360" y="110" width="280" height="52" rx="14" fill="#E8F3FF"/>
  <text x="500" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#2B6CB0">RAG（现查现答）</text>
  <text x="500" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">改的是检索</text>
  <text x="387" y="204" font-size="14" fill="#1F2329">能解决：</text>
  <text x="387" y="226" font-size="14" fill="#1F2329">· 知识会变（标准更新）</text>
  <text x="387" y="248" font-size="14" fill="#1F2329">· 要引用原文出处</text>
  <text x="387" y="286" font-size="14" fill="#1F2329">不能解决：</text>
  <text x="387" y="308" font-size="14" fill="#1F2329">· 模型的“说话方式”</text>
  <text x="387" y="330" font-size="14" fill="#1F2329">· 检索不到就答不好</text>
  <rect x="387" y="358" width="226" height="46" rx="10" fill="#EAFBF0"/>
  <text x="500" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E7A46">成本：知识库维护</text>
  <text x="500" y="401" text-anchor="middle" font-size="14" fill="#1E7A46">第 7 章已做</text>

  <!-- 卡片 3：微调 -->
  <rect x="665" y="110" width="280" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="665" y="110" width="280" height="52" rx="14" fill="#FFF4E5"/>
  <text x="805" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#D9480F">微调（出厂教）</text>
  <text x="805" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">改的是权重</text>
  <text x="692" y="204" font-size="14" fill="#1F2329">能解决：</text>
  <text x="692" y="226" font-size="14" fill="#1F2329">· 表达口径要稳（厂规）</text>
  <text x="692" y="248" font-size="14" fill="#1F2329">· 模型“本能”地懂厂里</text>
  <text x="692" y="286" font-size="14" fill="#1F2329">不能解决：</text>
  <text x="692" y="308" font-size="14" fill="#1F2329">· 知识会变（要重调）</text>
  <text x="692" y="330" font-size="14" fill="#1F2329">· 要原文出处</text>
  <rect x="692" y="358" width="226" height="46" rx="10" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="805" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#D9480F">成本：语料 + GPU</text>
  <text x="805" y="401" text-anchor="middle" font-size="14" fill="#D9480F">最贵，最后走</text>

  <!-- 箭头 -->
  <text x="350" y="250" text-anchor="middle" font-size="22" fill="#2B6CB0">→</text>
  <text x="655" y="250" text-anchor="middle" font-size="22" fill="#2B6CB0">→</text>

  <!-- 底部决策条 -->
  <rect x="120" y="480" width="760" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500" y="512" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">一句话原则：能提示词解决的不动检索，能检索解决的不动模型</text>
  <text x="500" y="538" text-anchor="middle" font-size="14" fill="#646A73">微调是最后的手段，不是第一选择——它最贵、最慢、维护成本最高</text>

  <rect x="180" y="580" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500" y="606" text-anchor="middle" font-size="14" fill="#1F2329">工业视角：知识会变走 RAG，口径要稳用微调——两者常常叠加用</text>

  <rect x="180.0" y="636" width="640" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="659" text-anchor="middle" font-size="14" fill="#646A73">图 9-1 技术选型决策链：提示词 → RAG → 微调（示意）</text>
</svg>
