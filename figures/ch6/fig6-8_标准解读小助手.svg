<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">标准解读小助手：五步流水线</text>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker>
  <marker id="arror" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FF7D00"/></marker>
  <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34C07C"/></marker></defs><rect x="90" y="90" width="190" height="80" rx="10" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.3"/>
  <text x="185" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">① 输入条款</text>
  <text x="185" y="140" text-anchor="middle" font-size="12" fill="#1F2329">粘一条 GB/企标条款</text>
  <text x="185" y="158" text-anchor="middle" font-size="11" fill="#646A73"></text><path d="M280 130 L340 130" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
<rect x="90" y="200" width="190" height="80" rx="10" fill="#F1F5F9" stroke="#1F2329" stroke-width="1.3"/>
  <text x="185" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">② 提示词模板</text>
  <text x="185" y="250" text-anchor="middle" font-size="12" fill="#1F2329">角色/任务/条款/要求</text>
  <text x="185" y="268" text-anchor="middle" font-size="11" fill="#646A73">四要素拼装</text><path d="M280 240 L340 240" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
<rect x="90" y="310" width="190" height="80" rx="10" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.3"/>
  <text x="185" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">③ 调用大模型</text>
  <text x="185" y="360" text-anchor="middle" font-size="12" fill="#1F2329">API 请求</text>
  <text x="185" y="378" text-anchor="middle" font-size="11" fill="#646A73">temperature=0.2</text><path d="M280 350 L340 350" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
<rect x="90" y="420" width="190" height="80" rx="10" fill="#FFF4E5" stroke="#D9480F" stroke-width="1.3"/>
  <text x="185" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#D9480F">④ 检查清单</text>
  <text x="185" y="470" text-anchor="middle" font-size="12" fill="#1F2329">三部分齐全？</text>
  <text x="185" y="488" text-anchor="middle" font-size="11" fill="#646A73">非空？非 mock？</text><path d="M280 460 L340 460" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
<rect x="90" y="530" width="190" height="80" rx="10" fill="#E6F7ED" stroke="#18794E" stroke-width="1.3"/>
  <text x="185" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#18794E">⑤ 输出解读</text>
  <text x="185" y="580" text-anchor="middle" font-size="12" fill="#1F2329">白话解释 + 检验要点</text>
  <text x="185" y="598" text-anchor="middle" font-size="11" fill="#646A73">+ 易错点</text>
  <rect x="430" y="90" width="480" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="460" y="125" font-size="14" font-weight="bold" fill="#1F2329">项目价值（第 6 章全套知识串起来）：</text>
  <text x="460" y="152" font-size="13" fill="#1F2329">· 提示词四要素 → ② 模板</text>
  <text x="460" y="176" font-size="13" fill="#1F2329">· API 调用 + Key 安全 → ③ 调用</text>
  <text x="460" y="200" font-size="13" fill="#1F2329">· 防幻觉 → ④ 检查清单（把“相信模型”换成“检查模型”）</text>
  <text x="460" y="224" font-size="13" fill="#1F2329">· mock 模式 → 没 Key 也能本地验证全流程</text>

  <rect x="430" y="270" width="480" height="120" rx="12" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="460" y="300" font-size="14" font-weight="bold" fill="#D9480F">检查清单示例（mock 模式被拦下）：</text>
  <text x="460" y="328" font-size="13" fill="#1F2329">缺少「易错点」部分 ✘ / 输出过短 ✘</text>
  <text x="460" y="352" font-size="13" fill="#1F2329">mock 输出非真实结果 ✘ —— 宁可报问题，不当真用</text>
  <text x="460" y="376" font-size="13" fill="#646A73">配置 API Key 后重跑 = 真实解读</text>

  <rect x="430" y="420" width="480" height="190" rx="12" fill="#E6F7ED" stroke="#34C07C" stroke-width="1.5"/>
  <text x="460" y="452" font-size="14" font-weight="bold" fill="#18794E">输出：三部分解读</text>
  <text x="460" y="480" font-size="13" fill="#1F2329">白话解释：用车间工人能听懂的话解释</text>
  <text x="460" y="504" font-size="13" fill="#1F2329">检验要点：检查时具体做什么、看什么</text>
  <text x="460" y="528" font-size="13" fill="#1F2329">易错点：最容易忽略或搞错的地方</text>
  <text x="460" y="560" font-size="13" fill="#646A73">泛理工科替换：化工规程 / 电气说明 / 设备手册 / 合同条款</text>
  <text x="460" y="584" font-size="13" fill="#646A73">规则文本 → 白话解释 + 执行要点，一套模式通吃</text>
  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 6-8 标准解读小助手：条款→模板→调用→检查→解读五步（示意）</text>
</svg>