<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">API 调用：程序 ↔ 大模型的标准接口</text>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker>
  <marker id="arror" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FF7D00"/></marker>
  <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34C07C"/></marker></defs>
  <rect x="80" y="100" width="840" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="500" y="135" font-size="15" font-weight="bold" fill="#1F2329">一个完整请求（OpenAI 兼容格式，全球通用）</text>
<rect x="140" y="110" width="280" height="80" rx="10" fill="#E8F3FF" stroke="#2B6CB0" stroke-width="1.3"/>
  <text x="280" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">① 接口地址 URL</text>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#1F2329">POST .../chat/completions</text>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#646A73"></text><rect x="140" y="200" width="280" height="80" rx="10" fill="#FFF4E5" stroke="#D9480F" stroke-width="1.3"/>
  <text x="280" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#D9480F">② 鉴权 API Key</text>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#1F2329">请求头带 Bearer 密钥</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#646A73">（从环境变量读取，绝不写进代码）</text><rect x="140" y="300" width="280" height="80" rx="10" fill="#F1F5F9" stroke="#1F2329" stroke-width="1.3"/>
  <text x="280" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2329">③ 请求体 JSON</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#1F2329">模型名 + 消息列表</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#646A73">+ temperature / max_tokens</text><rect x="140" y="400" width="280" height="80" rx="10" fill="#E6F7ED" stroke="#18794E" stroke-width="1.3"/>
  <text x="280" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#18794E">④ 响应体 JSON</text>
  <text x="280" y="452" text-anchor="middle" font-size="12" fill="#1F2329">choices[0].message.content</text>
  <text x="280" y="470" text-anchor="middle" font-size="11" fill="#646A73">+ usage 用量统计</text>
  <rect x="520" y="110" width="360" height="120" rx="12" fill="#F1F5F9"/>
  <text x="700" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2329">你的小工具（Python/Excel…）</text>
  <text x="700" y="170" text-anchor="middle" font-size="12" fill="#646A73">批量解读 100 条标准、喂给 Excel…</text>
  <text x="700" y="195" text-anchor="middle" font-size="12" fill="#646A73">“像法兰把两段管路接起来”</text>
  <rect x="520" y="280" width="360" height="120" rx="12" fill="#E8F3FF"/>
  <text x="700" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">大模型服务（云端）</text>
  <text x="700" y="340" text-anchor="middle" font-size="12" fill="#646A73">按 Token 计费，响应几秒到几十秒</text>
  <text x="700" y="365" text-anchor="middle" font-size="12" fill="#646A73">429 限流 / 401 密钥错 / 400 参数错</text>
  <path d="M520 240 L700 240" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M700 300 L520 300" stroke="#FF7D00" stroke-width="3" marker-end="url(#arror)"/>
  <text x="612" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#646A73">请求</text>
  <text x="612" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#D9480F">响应</text>
  <text x="700" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">换供应商 = 改三个环境变量：BASE_URL / KEY / MODEL</text>
  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 6-6 API 调用：程序通过标准接口请求模型，像法兰对接管路（示意）</text>
</svg>