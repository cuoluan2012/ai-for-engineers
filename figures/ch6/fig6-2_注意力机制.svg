<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <text x="500.0" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">注意力机制：评审会上聚焦关键议题</text>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker>
  <marker id="arror" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FF7D00"/></marker></defs>
  <rect x="60" y="90" width="880" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="500" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2329">评审会场景：专家不用逐字念完 30 页方案</text>

  <rect x="120" y="160" width="760" height="90" rx="12" fill="#F1F5F9"/>
  <text x="500" y="188" text-anchor="middle" font-size="13" fill="#646A73">会议桌（30 页技术方案 = 一整段文本）</text>
<circle cx="180" cy="230" r="30" fill="#E2E8F0"/>
  <text x="180" y="235" text-anchor="middle" font-size="11" fill="#646A73">略过</text><circle cx="300" cy="230" r="30" fill="#E2E8F0"/>
  <text x="300" y="235" text-anchor="middle" font-size="11" fill="#646A73">略过</text><circle cx="420" cy="230" r="34" fill="#FF7D00"/>
  <text x="420" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">受力分析</text><circle cx="580" cy="230" r="30" fill="#E2E8F0"/>
  <text x="580" y="235" text-anchor="middle" font-size="11" fill="#646A73">略过</text><circle cx="700" cy="230" r="30" fill="#E2E8F0"/>
  <text x="700" y="235" text-anchor="middle" font-size="11" fill="#646A73">略过</text><circle cx="820" cy="230" r="30" fill="#E2E8F0"/>
  <text x="820" y="235" text-anchor="middle" font-size="11" fill="#646A73">略过</text>
  <path d="M340 230 L430 230" stroke="#FF7D00" stroke-width="3" marker-end="url(#arror)"/>
  <text x="385" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#D9480F">聚焦</text>
  <path d="M580 230 L500 230" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="215" text-anchor="middle" font-size="12" fill="#646A73">次要</text>

  <rect x="60" y="330" width="880" height="250" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="500" y="365" font-size="16" font-weight="bold" fill="#1F2329">模型视角：处理每个词时，给其他词打分</text>
<rect x="120" y="385" width="100" height="56" rx="10" fill="#E2E8F0"/>
  <text x="170" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">虽然</text>
  <text x="170" y="430" text-anchor="middle" font-size="11" fill="#646A73">权重:低</text><rect x="230" y="385" width="100" height="56" rx="10" fill="#E2E8F0"/>
  <text x="280" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">温度</text>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#646A73">权重:高</text><rect x="330" y="385" width="100" height="56" rx="10" fill="#E2E8F0"/>
  <text x="380" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">但</text>
  <text x="380" y="430" text-anchor="middle" font-size="11" fill="#646A73">权重:中</text><rect x="430" y="385" width="100" height="56" rx="10" fill="#34C07C"/>
  <text x="480" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">转速</text>
  <text x="480" y="430" text-anchor="middle" font-size="11" fill="#FFFFFF">权重:关键</text><rect x="540" y="385" width="100" height="56" rx="10" fill="#34C07C"/>
  <text x="590" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">正常</text>
  <text x="590" y="430" text-anchor="middle" font-size="11" fill="#FFFFFF">权重:关键</text><rect x="650" y="385" width="100" height="56" rx="10" fill="#E2E8F0"/>
  <text x="700" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">，</text>
  <text x="700" y="430" text-anchor="middle" font-size="11" fill="#646A73">权重:低</text><rect x="740" y="385" width="100" height="56" rx="10" fill="#E2E8F0"/>
  <text x="790" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#646A73">放心</text>
  <text x="790" y="430" text-anchor="middle" font-size="11" fill="#646A73">权重:中</text>
  <text x="500" y="480" text-anchor="middle" font-size="13" fill="#1F2329">句子：“虽然温度高，但转速正常，放心” —— 处理到“放心”时，</text>
  <text x="500" y="505" text-anchor="middle" font-size="13" fill="#1F2329">模型把注意力主要放在“转速”“正常”上（绿色高亮）</text>
  <text x="500" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">这就是注意力机制：动态决定“谁重要、多看谁一眼”</text>
  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 6-2 注意力机制：像评审会聚焦关键议题，模型处理每个词时动态抓重点（示意）</text>
</svg>