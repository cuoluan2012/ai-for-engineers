  <text x="140" y="375" font-size="13" font-weight="bold" fill="#2B6CB0">① 预测</text>
  <text x="140" y="400" font-size="14" fill="#1F2329">“磨损”</text>
  <text x="140" y="424" font-size="12" fill="#646A73">已生成：这台主轴轴承磨损明显</text>
<rect x="330" y="350" width="260" height="90" rx="10" fill="#E8F3FF"/>
