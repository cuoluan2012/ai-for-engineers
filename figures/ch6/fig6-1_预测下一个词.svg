  <text x="120" y="205" font-size="14" fill="#646A73">模型看过几万亿个词，猜你最可能写：</text>
<rect x="120" y="215" width="150" height="44" rx="10" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
<text x="195" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">明显，</text>
