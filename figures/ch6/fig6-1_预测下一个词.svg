<rect x="470" y="215" width="150" height="44" rx="10" fill="#FFF4E5" stroke="#FF7D00" stroke-width="1.5"/>
<text x="545" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9480F">严重，</text>

  <rect x="90" y="300" width="820" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="120" y="335" font-size="14" font-weight="bold" fill="#2B6CB0">自回归生成：一个词一个词往外蹦</text>
