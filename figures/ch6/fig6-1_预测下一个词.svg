  <text x="350" y="400" font-size="14" fill="#1F2329">“明显”</text>
  <text x="350" y="424" font-size="12" fill="#646A73">已生成：这台主轴轴承磨损明显</text>
<rect x="560" y="350" width="260" height="90" rx="10" fill="#E8F3FF"/>
  <text x="580" y="375" font-size="13" font-weight="bold" fill="#2B6CB0">③ 再接再预测</text>
  <text x="580" y="400" font-size="14" fill="#1F2329">“，建议停机检修”</text>
  <text x="580" y="424" font-size="12" fill="#646A73">已生成：这台主轴轴承磨损明显</text>
  <rect x="180.0" y="622" width="640" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500.0" y="648" text-anchor="middle" font-size="14" fill="#646A73">图 6-1 大模型本质是“预测下一个词”，一个词一个词地生成整段话（示意）</text>
