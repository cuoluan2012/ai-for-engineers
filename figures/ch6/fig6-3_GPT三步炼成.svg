  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker>
  <marker id="arror" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FF7D00"/></marker></defs><rect x="70" y="110" width="270" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="110" width="270" height="46" rx="14" fill="#2B6CB0"/>
  <text x="205" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">① 预训练 Pre-training</text>
  <text x="205" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#2B6CB0">读万卷书</text>
