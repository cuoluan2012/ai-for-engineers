<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="PingFang SC, Heiti SC, sans-serif">
  <rect width="1000" height="680" fill="#F7F8FA"/>
  <!-- 标题 -->
  <text x="500" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2329">三种分类器：同一个问题，三种思路</text>

  <!-- 左：KNN -->
  <g>
    <rect x="60" y="90" width="290" height="470" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="60" y="90" width="290" height="44" rx="14" fill="#2B6CB0"/>
    <text x="205" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">KNN（看邻居投票）</text>
    <!-- 散点：正常（蓝）故障（橙） -->
    <circle cx="130" cy="250" r="9" fill="#2B6CB0"/><circle cx="150" cy="280" r="9" fill="#2B6CB0"/><circle cx="170" cy="235" r="9" fill="#2B6CB0"/>
    <circle cx="120" cy="310" r="9" fill="#2B6CB0"/><circle cx="190" cy="270" r="9" fill="#2B6CB0"/>
    <circle cx="280" cy="330" r="9" fill="#FF7D00"/><circle cx="300" cy="300" r="9" fill="#FF7D00"/><circle cx="260" cy="360" r="9" fill="#FF7D00"/><circle cx="310" cy="370" r="9" fill="#FF7D00"/>
    <!-- 新样本 + K=5 圈 -->
    <circle cx="230" cy="330" r="13" fill="none" stroke="#34C07C" stroke-width="3"/>
    <circle cx="230" cy="330" r="52" fill="none" stroke="#34C07C" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="230" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#18794E">？</text>
    <text x="205" y="440" text-anchor="middle" font-size="13" fill="#1F2329">圈出最近的 K=5 个老样本</text>
    <text x="205" y="464" text-anchor="middle" font-size="13" fill="#1F2329">多数是故障 → 判故障</text>
    <text x="205" y="520" text-anchor="middle" font-size="12" fill="#646A73">类比：新员工拿不准，</text>
    <text x="205" y="540" text-anchor="middle" font-size="12" fill="#646A73">问身边 K 个老师傅听多数意见</text>
  </g>

  <!-- 中：决策树 -->
  <g>
    <rect x="365" y="90" width="290" height="470" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="365" y="90" width="290" height="44" rx="14" fill="#FF7D00"/>
    <text x="510" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">决策树（一串 if-else）</text>
    <!-- 树 -->
    <rect x="445" y="160" width="130" height="40" rx="8" fill="#EEF2FF"/>
    <text x="510" y="185" text-anchor="middle" font-size="13" fill="#2B6CB0">振动 &gt; 4 mm/s ?</text>
    <path d="M475 200 L400 245 M545 200 L620 245" stroke="#94A3B8" stroke-width="2"/>
    <text x="415" y="230" font-size="11" fill="#646A73">否</text><text x="605" y="230" font-size="11" fill="#646A73">是</text>
    <rect x="350" y="245" width="100" height="40" rx="8" fill="#EEF2FF"/>
    <text x="400" y="270" text-anchor="middle" font-size="13" fill="#2B6CB0">温度 &gt; 60 ?</text>
    <rect x="570" y="245" width="100" height="40" rx="8" fill="#E6F7ED"/>
    <text x="620" y="270" text-anchor="middle" font-size="13" fill="#18794E">判故障</text>
    <path d="M380 285 L340 330 M420 285 L460 330" stroke="#94A3B8" stroke-width="2"/>
    <rect x="290" y="330" width="100" height="40" rx="8" fill="#E6F7ED"/>
    <text x="340" y="355" text-anchor="middle" font-size="13" fill="#18794E">判故障</text>
    <rect x="410" y="330" width="100" height="40" rx="8" fill="#F1F5F9"/>
    <text x="460" y="355" text-anchor="middle" font-size="13" fill="#1F2329">判正常</text>
    <text x="510" y="440" text-anchor="middle" font-size="13" fill="#1F2329">一层层问下去，到叶子给答案</text>
    <text x="510" y="520" text-anchor="middle" font-size="12" fill="#646A73">类比：老师傅的判断树</text>
    <text x="510" y="540" text-anchor="middle" font-size="12" fill="#646A73">可解释性最强，人看得懂</text>
  </g>

  <!-- 右：逻辑回归 -->
  <g>
    <rect x="670" y="90" width="270" height="470" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="670" y="90" width="270" height="44" rx="14" fill="#34C07C"/>
    <text x="805" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">逻辑回归（输出概率）</text>
    <!-- 概率条 -->
    <rect x="700" y="170" width="210" height="26" rx="13" fill="#F1F5F9"/>
    <rect x="700" y="170" width="110" height="26" rx="13" fill="#2B6CB0"/>
    <text x="805" y="188" text-anchor="middle" font-size="12" fill="#FFFFFF">故障概率 52%</text>
    <!-- 刻度 -->
    <text x="700" y="220" font-size="12" fill="#646A73">0</text>
    <text x="805" y="220" text-anchor="middle" font-size="12" fill="#646A73">0.5</text>
    <text x="910" y="220" text-anchor="end" font-size="12" fill="#646A73">1</text>
    <line x1="805" y1="230" x2="805" y2="245" stroke="#D32F2F" stroke-width="2.5"/>
    <text x="805" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#D32F2F">及格线 0.5</text>
    <text x="805" y="300" text-anchor="middle" font-size="13" fill="#1F2329">超过 0.5 → 判故障</text>
    <text x="805" y="322" text-anchor="middle" font-size="13" fill="#1F2329">输出的是概率，不是硬判断</text>
    <rect x="700" y="360" width="210" height="60" rx="10" fill="#E6F7ED"/>
    <text x="805" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#18794E">适合做风险排序</text>
    <text x="805" y="406" text-anchor="middle" font-size="12" fill="#646A73">按概率从高到低排检修优先级</text>
    <text x="805" y="520" text-anchor="middle" font-size="12" fill="#646A73">类比：打"故障可能性分"，</text>
    <text x="805" y="540" text-anchor="middle" font-size="12" fill="#646A73">过了及格线就报</text>
  </g>

  <!-- 底部图注 -->
  <text x="500" y="652" text-anchor="middle" font-size="16" fill="#646A73">图 4-4 三种分类器：KNN / 决策树 / 逻辑回归（示意）</text>
</svg>
