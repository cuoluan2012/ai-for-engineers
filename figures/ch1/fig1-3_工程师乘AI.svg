<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1000" height="580" rx="18" fill="#F7F8FA"/>
  <text x="500" y="46" font-size="28" font-weight="bold" fill="#1F2329" text-anchor="middle">工程师 × AI：乘法关系</text>
  <text x="500" y="74" font-size="16" fill="#646A73" text-anchor="middle">AI 提供"从数据里找规律"的通用能力 · 工程师提供"定义问题、判断对错、落地执行"的领域能力</text>

  <!-- 左侧：工程师 -->
  <rect x="55" y="115" width="350" height="330" rx="16" fill="#E8F0FA" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="230" y="150" font-size="20" font-weight="bold" fill="#2B6CB0" text-anchor="middle">工程师（你）</text>

  <!-- 老张简笔头像：安全帽 + 工装 -->
  <circle cx="230" cy="225" r="40" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2.5"/>
  <rect x="196" y="188" width="68" height="20" rx="10" fill="#FF7D00"/>
  <path d="M210 210 q20 -8 40 0" fill="none" stroke="#1F2329" stroke-width="2.5"/>
  <circle cx="215" cy="240" r="4" fill="#1F2329"/>
  <circle cx="245" cy="240" r="4" fill="#1F2329"/>
  <path d="M218 252 q12 8 24 0" fill="none" stroke="#1F2329" stroke-width="2.5"/>
  <rect x="186" y="262" width="88" height="34" rx="8" fill="#2B6CB0"/>
  <text x="230" y="284" font-size="13" fill="#FFFFFF" text-anchor="middle">工程师</text>

  <g font-size="14" fill="#1F2329" text-anchor="middle">
    <rect x="90" y="320" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="230" y="344">定义问题 · 判断对错</text>
    <rect x="90" y="370" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="230" y="394">领域知识（公差/工艺/图纸）</text>
    <rect x="90" y="420" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="230" y="444">落地执行 · 承担责任</text>
  </g>

  <!-- 中间：× 号与箭头 -->
  <text x="500" y="250" font-size="64" font-weight="bold" fill="#FF7D00" text-anchor="middle">×</text>
  <text x="500" y="290" font-size="15" fill="#646A73" text-anchor="middle">相乘</text>
  <path d="M 300 280 L 700 280" stroke="#E2E8F0" stroke-width="3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FF7D00"/>
    </marker>
  </defs>

  <!-- 右侧：AI -->
  <rect x="595" y="115" width="350" height="330" rx="16" fill="#FFF1E5" stroke="#FF7D00" stroke-width="2.5"/>
  <text x="770" y="150" font-size="20" font-weight="bold" fill="#FF7D00" text-anchor="middle">AI</text>

  <!-- 芯片简笔 -->
  <rect x="740" y="180" width="60" height="60" rx="10" fill="#FFFFFF" stroke="#FF7D00" stroke-width="2.5"/>
  <g stroke="#FF7D00" stroke-width="3">
    <line x1="750" y1="180" x2="750" y2="166"/>
    <line x1="770" y1="180" x2="770" y2="166"/>
    <line x1="790" y1="180" x2="790" y2="166"/>
    <line x1="750" y1="240" x2="750" y2="254"/>
    <line x1="770" y1="240" x2="770" y2="254"/>
    <line x1="790" y1="240" x2="790" y2="254"/>
    <line x1="740" y1="195" x2="726" y2="195"/>
    <line x1="740" y1="210" x2="726" y2="210"/>
    <line x1="740" y1="225" x2="726" y2="225"/>
    <line x1="800" y1="195" x2="814" y2="195"/>
    <line x1="800" y1="210" x2="814" y2="210"/>
    <line x1="800" y1="225" x2="814" y2="225"/>
  </g>
  <rect x="762" y="202" width="16" height="16" rx="3" fill="#FF7D00"/>

  <g font-size="14" fill="#1F2329" text-anchor="middle">
    <rect x="630" y="320" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="770" y="344">从数据里找规律（模式识别/预测）</text>
    <rect x="630" y="370" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="770" y="394">读文档、答问题、写报告</text>
    <rect x="630" y="420" width="280" height="40" rx="10" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="770" y="444">不知疲倦 · 标准不漂移</text>
  </g>

  <!-- 底部结果 -->
  <rect x="60" y="470" width="880" height="56" rx="14" fill="#FFFFFF" stroke="#34C07C" stroke-width="2"/>
  <text x="500" y="498" font-size="18" font-weight="bold" fill="#228B57" text-anchor="middle">= 真正的生产力：会用 AI 的工程师</text>
  <text x="500" y="520" font-size="14" fill="#646A73" text-anchor="middle">你不是变成程序员，而是变成"会用 AI 的工程师"——把 AI 用回你的专业</text>

  <text x="500" y="572" font-size="14" fill="#646A73" text-anchor="middle">图 1-3 工程师 × AI：乘法关系（示意）</text>
</svg>
