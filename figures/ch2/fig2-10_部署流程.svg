<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#FF7D00"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" rx="18" fill="#F7F8FA"/>
  <text x="500" y="46" font-size="28" font-weight="bold" fill="#1F2329" text-anchor="middle">部署：从"自己电脑能跑"到"全世界能用"</text>
  <text x="500" y="74" font-size="16" fill="#646A73" text-anchor="middle">本地能跑 ≠ 正式可用 —— 中间隔着一个部署</text>

  <!-- 第一段：本地开发 -->
  <g>
    <rect x="60" y="110" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
    <text x="200" y="140" font-size="16" font-weight="bold" fill="#2B6CB0" text-anchor="middle">① 本地开发</text>
    <!-- 笔记本 -->
    <rect x="130" y="158" width="140" height="70" rx="8" fill="#E8F0FA"/>
    <rect x="138" y="166" width="124" height="44" rx="4" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1"/>
    <text x="200" y="192" font-size="13" fill="#1F2329" text-anchor="middle">代码能跑</text>
    <rect x="130" y="222" width="60" height="10" rx="4" fill="#2B6CB0"/>
    <text x="200" y="256" font-size="13" fill="#646A73" text-anchor="middle">只有你能用，别人访问不到</text>
  </g>

  <!-- 箭头 -->
  <line x1="344" y1="195" x2="386" y2="195" stroke="#FF7D00" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 第二段：云服务器 -->
  <g>
    <rect x="390" y="110" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#FF7D00" stroke-width="2"/>
    <text x="530" y="140" font-size="16" font-weight="bold" fill="#FF7D00" text-anchor="middle">② 云服务器部署</text>
    <!-- 服务器 -->
    <rect x="440" y="158" width="180" height="70" rx="8" fill="#FFF1E5"/>
    <rect x="450" y="166" width="160" height="16" rx="4" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1"/>
    <rect x="450" y="186" width="160" height="16" rx="4" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1"/>
    <rect x="450" y="206" width="160" height="16" rx="4" fill="#FFFFFF" stroke="#FF7D00" stroke-width="1"/>
    <text x="530" y="256" font-size="13" fill="#646A73" text-anchor="middle">7×24 运行，接好网络，全球可用</text>
    <!-- 三层标签 -->
    <rect x="420" y="268" width="74" height="22" rx="6" fill="#FFF1E5"/>
    <text x="457" y="283" font-size="12" fill="#FF7D00" text-anchor="middle">IaaS</text>
    <rect x="498" y="268" width="74" height="22" rx="6" fill="#FFF1E5"/>
    <text x="535" y="283" font-size="12" fill="#FF7D00" text-anchor="middle">PaaS</text>
    <rect x="576" y="268" width="74" height="22" rx="6" fill="#FFF1E5"/>
    <text x="613" y="283" font-size="12" fill="#FF7D00" text-anchor="middle">SaaS</text>
    <text x="530" y="300" font-size="12" fill="#8A9099" text-anchor="middle">租空厂房 / +水电 / 直接租产线</text>
  </g>

  <!-- 箭头 -->
  <line x1="674" y1="195" x2="716" y2="195" stroke="#FF7D00" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 第三段：容器化集群 -->
  <g>
    <rect x="720" y="110" width="220" height="170" rx="14" fill="#FFFFFF" stroke="#34C07C" stroke-width="2"/>
    <text x="830" y="140" font-size="16" font-weight="bold" fill="#34C07C" text-anchor="middle">③ 容器化集群</text>
    <g font-size="12" fill="#FFFFFF" text-anchor="middle">
      <rect x="740" y="160" width="52" height="40" rx="6" fill="#34C07C"/><text x="766" y="184">容器</text>
      <rect x="800" y="160" width="52" height="40" rx="6" fill="#34C07C"/><text x="826" y="184">容器</text>
      <rect x="860" y="160" width="52" height="40" rx="6" fill="#34C07C"/><text x="886" y="184">容器</text>
      <rect x="740" y="210" width="52" height="40" rx="6" fill="#34C07C"/><text x="766" y="234">容器</text>
      <rect x="800" y="210" width="52" height="40" rx="6" fill="#34C07C"/><text x="826" y="234">容器</text>
    </g>
    <text x="830" y="272" font-size="13" fill="#646A73" text-anchor="middle">Docker 打包环境</text>
    <text x="830" y="292" font-size="12" fill="#8A9099" text-anchor="middle">K8s 自动调度 / 容错</text>
  </g>

  <!-- 底部：三层云服务详情 -->
  <g>
    <text x="90" y="330" font-size="16" font-weight="bold" fill="#1F2329">云服务三层，选哪层看你管到哪：</text>
    <g font-size="13" fill="#1F2329" text-anchor="middle">
      <rect x="60" y="350" width="280" height="78" rx="10" fill="#FFF1E5" stroke="#FF7D00" stroke-width="1.5"/>
      <text x="200" y="374" font-size="14" font-weight="bold">IaaS 基础设施即服务</text>
      <text x="200" y="396">一台裸服务器（CPU/内存/硬盘）</text>
      <text x="200" y="416" font-size="12" fill="#646A73">环境全自己装——自由度最高</text>
      <rect x="360" y="350" width="280" height="78" rx="10" fill="#FFF1E5" stroke="#FF7D00" stroke-width="1.5"/>
      <text x="500" y="374" font-size="14" font-weight="bold">PaaS 平台即服务</text>
      <text x="500" y="396">服务器 + 运行环境（数据库等）</text>
      <text x="500" y="416" font-size="12" fill="#646A73">只管自己的应用代码</text>
      <rect x="660" y="350" width="280" height="78" rx="10" fill="#FFF1E5" stroke="#FF7D00" stroke-width="1.5"/>
      <text x="800" y="374" font-size="14" font-weight="bold">SaaS 软件即服务</text>
      <text x="800" y="396">直接可用的软件</text>
      <text x="800" y="416" font-size="12" fill="#646A73">连部署都省了</text>
    </g>
  </g>

  <!-- 底部：环境一致性 -->
  <g>
    <rect x="60" y="460" width="880" height="76" rx="12" fill="#E8F0FA" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="90" y="490" font-size="15" font-weight="bold" fill="#1F2329">部署的经典难题：环境一致性</text>
    <text x="90" y="516" font-size="14" fill="#646A73">"在我电脑上明明能跑，到你电脑上就报错" —— Docker 把软件+环境打包成标准单元，解决单机一致；</text>
    <text x="90" y="536" font-size="13" fill="#646A73">容器成百上千后，Kubernetes 负责自动调度、重启、扩容、迁移（容器编排）</text>
  </g>

  <text x="500" y="580" font-size="14" fill="#646A73" text-anchor="middle">图 2-10 部署：本地 → 云服务器 → 容器化集群（示意）</text>
</svg>
